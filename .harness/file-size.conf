# Per-project thresholds for ~/.claude/hooks/check-file-size.sh.
#
# The hook's default warns at 200 lines, which contradicts this project's own
# rule: .claude/rules/starter-patterns.md says to consider splitting a file over
# ~300 lines, and says in as many words not to split a coherent one just to hit
# a number. Between 2026-07-20 and 2026-07-26 the hook warned 585 times and 576
# of those (98%) were for files of 200-299 lines, which that rule had already
# decided were fine. Ninety-five distinct files, none of them a defect.
#
# So the warn moves to 260, which still gives 40 lines of runway before the
# block, and the block stays where the project rule puts it. The block is worth
# keeping: it is what forced query-editor-page.tsx apart into use-visual-mode,
# use-editor-height and query-editor-header, and it is why the target tests live
# in their own file.
WARN_THRESHOLD=260
BLOCK_THRESHOLD=300
