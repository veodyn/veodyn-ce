# Veodyn instance configuration (white-label).
#
# Copy to veodyn.config.yaml (or point VEODYN_CONFIG_PATH at it) to brand a
# tenant. Every key is OPTIONAL; anything omitted falls back to the neutral
# Veodyn default, so an empty file is a valid config. Any key can also be
# overridden by an env var using __ as the nesting separator
# (e.g. VEODYN_BRAND__NAME=Meridian). Secrets come from env only, never here.
#
# This example is a fictional tenant (Meridian Transit Authority) that
# exercises every key below with invented values, so it doubles as reference
# documentation for the config schema. It does not correspond to any real
# organisation, domain, or deployment.

# `logo` is a path under public/. Omit it and an unbranded instance gets the
# bundled Veodyn mark (/images/veodyn-mark.svg); set `name` without a `logo` and
# you get the name on its own, never Veodyn's mark next to someone else's name.
#
# It is left commented out here because a tenant logo is an asset the operator
# supplies, and this repository bundles none that would suit a fictional one.
# Drop your own file under app/public/ and point this at it.
brand:
  name: "Meridian Transit Authority"
  # logo: /images/meridian-mark.svg
  help_url: https://help.example.com
  # The product documentation site (the Docusaurus build under docs/). Adds a
  # "Documentation" row to the sidebar footer; help_url stays the tenant's own
  # support site. Omit either and its row is absent.
  # docs_url: https://docs.example.com

theme:
  accent: "#3d6b52"
  chart_palette: ["#3d6b52", "#b2542c", "#3b5b92", "#8a4fbe", "#c2447a", "#d9a441", "#2f9e9e", "#6b7a3d"]
  # fonts: { display: Newsreader, ui: Geist, mono: Geist Mono, source: external }

# This list is the registry: a domain exists on an instance if and only if it is
# named here. /data/<key> refuses anything else, and the sidebar rows and the
# Domain selects on the KPI and report forms are all built from it. Leaving it
# empty is legal and means the instance has no domains at all.
#
# `icon` takes a lucide name from the curated set in src/lib/sidebar-nav.ts
# (bus, car, train, ship, plane, globe, wind, activity). An unknown name falls
# back to a plain folder silently, so it looks like a deliberate choice rather
# than a typo: this file said `train-front` for two months, which is a real
# lucide icon and not one of the eight, so Rail rendered as a folder.
domains:
  - { key: transit, label: Transit, icon: bus }
  - { key: freeway, label: Freeways, icon: car }
  - { key: rail, label: Rail, icon: train }

home:
  tagline: "Meridian Transit Authority's regional operations dashboard."

assistant:
  widget_url: https://assistant.example.com
  integration_id: meridian-redash
  sub_agent: meridian
  title: "Meridian Data Assistant"

# map:
