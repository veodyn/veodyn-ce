# ai:
#   enabled: true
#   endpoint: https://your-ai-endpoint
#   # the AI key is a SECRET: set VEODYN_AI__KEY in the environment, not here
# features:
#   # Optional surfaces, off unless an instance asks for them. Query Snippets is
#   # reusable SQL fragments with a trigger word; with none written it is an
#   # empty page and a permanent nav row, so it ships off. Off means the route
#   # 404s and the nav entry is absent, not that a button is greyed out.
#   query_snippets: true
#   # The draft workflow. Off by default: saving a query puts it straight in the
#   # shared list, and the word "draft" appears nowhere in the UI.
#   #
#   # Turn it on and the author decides when a query is ready. Until they pick
#   # "Share with the team" it is listed only for them, and it carries a Draft
#   # badge. This is a rule about the LIST, not a permission: anyone who can
#   # reach the data source can still open a draft from its link, so do not use
#   # it to keep a query secret.
#   query_drafts: true
# wall_mode:
#   default_dashboard: transportation-overview
# visualizations:
#   # Which visualization types an analyst can CREATE, by Redash type name.
#   # OMIT this whole section (or set enabled to nothing) to offer everything
#   # this build registers, which is the default. Present, it is an allowlist:
#   # only these appear in the type selector and in the Visual builder.
#   #
#   # It never hides a visualization that already exists. A dashboard widget
#   # saved with a type you later drop from this list still renders; you are
#   # choosing what can be made, not what can be read.
#   #
#   # A name no plugin in this image registers is logged once and ignored, so
#   # rolling back to an image without a plugin degrades the UI instead of
#   # stopping the app.
#   #
#   # Core types: TABLE, CHART, COUNTER, PIVOT, FUNNEL, DETAILS, MAP, HEATMAP,
