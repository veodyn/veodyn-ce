server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The site lives under /docs (see the Dockerfile COPY and the baseUrl in
    # docusaurus.config.ts), so / holds nothing. Send it to the real entrypoint
    # rather than serving a 404 to anyone who trims the path.
    location = / {
        return 302 /docs/;
    }

    # Docusaurus emits real directories per route, so plain static serving
    # works; its own 404 page replaces nginx's.
    error_page 404 /docs/404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Hashed assets are immutable; everything else revalidates.
    location /docs/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
