name: veodyn-api-test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  veodyn-api-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    env:
      VEODYN_TEST_DATABASE_URL: postgresql+psycopg://veodyn@localhost:5432/veodyn_test
      VEODYN_TEST_REDIS_URL: redis://localhost:6379/15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: veodyn
          POSTGRES_DB: veodyn_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --no-cache-dir uv
      - run: uv sync --frozen

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy veodyn_api

      - run: uv run pytest --junitxml=junit.xml --cov --cov-report=term --cov-report=xml:coverage.xml

      - run: uv run python -m veodyn_api.openapi > /tmp/openapi.json
      - run: diff -u openapi.json /tmp/openapi.json

      - run: uv run python -m veodyn_api.services.chat.help_index check ../docs/docs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veodyn-api-test-reports
          path: |
            api/junit.xml
            api/coverage.xml
          retention-days: 7
          if-no-files-found: warn
