---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: {{ .Release.Name }}
    {{- if .Values.chainName }}
    chain: {{ .Values.chainName }}
    {{- end }}
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  progressDeadlineSeconds: 600
  {{- if .Values.chainName }}
  replicas: {{ (index .Values .Values.appName "replicas" .Values.chainName) | default (index .Values .Values.appName "replicas").default }}
  {{- else }}
  replicas: {{ (index .Values .Values.appName "replicas").default }} 
  {{- end }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: {{ .Release.Name }}
      {{- if .Values.chainName }} 
      chainName: {{ .Values.chainName }}
      {{- end }}
  strategy:
    type: {{ index .Values .Values.appName "strategyType" }}
    {{- if eq (index .Values .Values.appName "strategyType") "RollingUpdate" }}
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 25%
    {{- end }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        {{- if .Values.chainName }}
        chainName: {{ .Values.chainName }}
        {{- end }}
      annotations:
        deploymentRevisionId: "{{ .Release.Revision }}"
    spec:
      containers:
      - name: {{ .Release.Name }}
        image: "{{ .Values.image }}:{{ .Values.imageTag }}"
        args:
           {{- range $value := (index .Values .Values.appName "args") }}
           - {{ $value | quote }}
           {{- end }}
        {{- if index .Values .Values.appName "workDir" }}
        workingDir: {{ index .Values .Values.appName "workDir" | quote }}
        {{- end }}
        {{- /*
          Either map, not `env` alone. This used to be gated on `env` only, so
          a release with everything in baseEnv and an empty env rendered NO env
          block at all and baseEnv silently never reached the pod. The migrate
          Job next door has always rendered both unconditionally, so the two
          templates disagreed about what the pod's environment was, which is
          what let the migrate hook's consistency guard approve a release whose
          app container would come up without the variable it had just checked.
        */}}
        {{- if or (index .Values .Values.appName "env") (index .Values .Values.appName "baseEnv") }}
        env:
          {{- range $key, $value := (index .Values .Values.appName "baseEnv") }}
            {{- if (hasPrefix "secret:" (printf "%s" $value)) }}
          - name: {{ $key }}
            valueFrom:
              secretKeyRef:
                name: {{ $.Values.app.SharedSecretName }}
                key: {{ $value | replace "secret:" "" }}
            {{- else }}
          - name: {{ $key }} 
            value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          {{- range $key, $value := (index .Values .Values.appName "env") }}
            {{- if (hasPrefix "secret:" (printf "%s" $value)) }}
          - name: {{ $key }}
            valueFrom:
              secretKeyRef:
                name: {{ $.Values.app.SharedSecretName }}
                key: {{ $value | replace "secret:" "" }}
            {{- else }}
          - name: {{ $key }}
            value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          {{- if .Values.chainName }}
          - name: NETWORK
            value: '{{ (split "-" .Values.chainName)._0 }}'
          - name: CHAIN_ID
            value: '{{ (split "-" .Values.chainName)._1 }}'
          {{- end }}
        {{- end }}
        imagePullPolicy: Always
        {{- if index .Values .Values.appName "command" }}
        {{- /*
          toJson, not the bare value. Go prints a string slice as
          [uv run python -m veodyn_api.worker], and YAML reads that flow
          sequence as ONE element because it holds no commas, so the kubelet
          tried to exec a file literally named "uv run python -m
          veodyn_api.worker" and the pod crash-looped on StartError.
        */}}
        command: {{ index .Values .Values.appName "command" | toJson }}
        {{- end }}
        {{- if index .Values .Values.appName "port" }}
        ports:
        - containerPort: {{ index .Values .Values.appName "port" }}
          name: lbport
          protocol: TCP
        {{- end }}
        resources:
          limits:
            cpu: {{ index .Values .Values.appName "limitsCpu" }}
            memory: {{ index .Values .Values.appName "limitsMemory" }}
          requests:
            cpu: {{ index .Values .Values.appName "requestsCpu" }}
            memory: {{ index .Values .Values.appName "requestsMemory" }}
        {{- if (index .Values .Values.appName "readnessProbe") }}
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: {{ index .Values .Values.appName "readnessProbe" "path" }}
            port: {{ index .Values .Values.appName "readnessProbe" "port" }}
            scheme: HTTP
          initialDelaySeconds: {{ index .Values .Values.appName "readnessProbe" "initialDelaySeconds" | default "15" }}
          periodSeconds: {{ index .Values .Values.appName "readnessProbe" "periodSeconds" | default "60" }}
          successThreshold: 1
          timeoutSeconds: {{ index .Values .Values.appName "readnessProbe" "timeoutSeconds" | default "20" }}
        {{- end }}
        {{- if (index .Values .Values.appName "livenessProbe") }}
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: {{ index .Values .Values.appName "livenessProbe" "path" }}
            port: {{ index .Values .Values.appName "livenessProbe" "port" }}
            scheme: HTTP
          initialDelaySeconds: {{ index .Values .Values.appName "livenessProbe" "initialDelaySeconds" | default "15" }}
          periodSeconds: {{ index .Values .Values.appName "livenessProbe" "periodSeconds" | default "60" }}
          successThreshold: 1
          timeoutSeconds: {{ index .Values .Values.appName "livenessProbe" "timeoutSeconds" | default "20" }}
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {}
          privileged: false
          readOnlyRootFilesystem: false
          runAsNonRoot: false
        stdin: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        tty: true
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name:  {{ .Values.registrySecretName }}
      restartPolicy: Always
      securityContext: {}
      terminationGracePeriodSeconds: 30
