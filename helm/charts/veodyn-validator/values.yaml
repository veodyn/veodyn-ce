---
# Defaults for the veodyn-validator chart: the GTFS-Realtime validator that
# veodyn-api calls before it publishes a feed. One Deployment and one Service.
#
# **Its own chart rather than a release of veodyn-api's**, for two reasons that
# are both in the templates. That chart renders a migrate Job unconditionally,
# and this service has no database at all; and it renders an Ingress, which
# this service must not have (see `serviceType` below).
#
# **There is NO ingress here, and that is the security boundary.** The service
# has no authentication of any kind: it takes a URL, downloads it, and spends
# about 48 seconds and several gigabytes preparing it. Exposed publicly that is
# a request that costs a pod's whole memory budget, and an unauthenticated
# fetcher of arbitrary URLs besides. Only veodyn-api calls it, in-cluster, over
# the ClusterIP Service. Every other service in this deployment has its own
# public ingress; this one is the exception and it is deliberate.
image: "PUT_IMAGE_IN_ENV_VALUES_FILE"
imageTag: ""
kubeNamespace: ""

# Defaulted, not empty, and it matches veodyn-api's chart for the same reason.
# helm/deploy.sh creates a secret named `registry-harbor` in the namespace if
# one is missing, and no per-environment values file sets this: the charts
# carry it. Left empty here the Deployment renders with no imagePullSecrets,
# every node fails the pull with "no basic auth credentials", and the deploy
# job still goes green because helm --wait times out on readiness rather than
# on the pull. Measured exactly that way on the first deploy of this chart.
registrySecretName: registry-harbor

# Read with `index .Values .Values.appName`, the same convention the other
# charts use, so a release is installed with `--set appName=app`.
app:
  # ONE. Each replica prepares and holds its own copy of the static archive,
  # so a second replica does not share the work, it doubles the memory. Scaling
  # this is not a capacity decision, it is a decision to pay for the archive
  # again; a shared cache would be a different design.
  replicas:
    default: 1
  strategyType: Recreate
  port: 8000

  # **Sized for the version we pin, which is 0.3.0**, and measured here rather
  # than taken on report: 584 MB peak RSS for one prepared feed, on the same
  # 18 MB, 92,360-trip archive the package author sizes against
  # (`corpus/agencies/mdb-437` in that repository). The author measures the
  # same 584 MB resident on Linux with a 618 MB peak, and 618 is the number
  # this pod is sized against, because the limit is enforced on Linux and
  # against the peak. 0.2.0 cost about 3.5 GB for the same archive, which is
  # why these were 4Gi/6Gi until the pin moved. Re-measure before lowering
  # them again.
  #
  # **Size against the PEAK, not the steady state.** A limit that merely fits
  # what a prepared feed retains will OOM during the first prepare, and a peak
  # once reached is paid for good: freed pages stay reusable by the process but
  # are not handed back to the OS. What made this worth writing down: an
  # intermediate version on the author's side cut the live object graph from
  # 1,684 MB to 328 MB while resident memory did not fall at all, it rose, to
  # 2.0 GB, because the loader still built every row before the compaction
  # could happen. An object-graph number is not one this pod can ever observe,
  # so measure RSS, which is what the limit is enforced against.
  #
  # The headroom is deliberate and it is NOT slack for a bigger cache. 584 MB
  # is one archive of one size; a larger agency costs more, and the request has
  # to cover the worst archive this deployment is pointed at, not the one that
  # happened to be measured. VALIDATOR_CACHE_SIZE (default 1) multiplies it,
  # and the chart cannot see that value, so raising it means raising these in
  # the same change.
  limitsCpu: "2"
  limitsMemory: "2Gi"
  requestsCpu: "500m"
  requestsMemory: "1Gi"

  # Recreate, not RollingUpdate, and the reason is the memory above: a rolling
  # update runs the old and new pods at once, so it needs headroom for two
  # prepared archives on one node. The cost is a gap in validation during a
  # deploy, which publish attempts see as a failed attempt and retry, and which
  # is the cheaper of the two failures.

  readnessProbe:
    path: /health
    port: 8000
    # Generous initial delay: the process answers /health as soon as it is up,
    # but it is competing with a prepare for the same CPU whenever one is in
    # flight, and a probe that fails during a prepare would restart the pod and
    # throw the prepare away.
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 10

  baseEnv: {}
  env: {}
