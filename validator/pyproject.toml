[project]
name = "validator-service"
version = "0.1.0"
description = "HTTP wrapper around gtfs-rt-validator, so veodyn-api validates a feed over the network instead of holding a prepared archive in every replica"
requires-python = ">=3.11,<3.13"
license = "AGPL-3.0-only"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    # Pinned exactly, per the brief: the wrapper reaches into gtfs_rt_validator.runner
    # and gtfs_rt_validator.report.occurrence, which are real but narrower than the
    # api.py surface, so an unpinned bump could move code this service depends on
    # without anything here noticing at install time.
    "gtfs-rt-validator==0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
    "mypy>=1.13",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["validator_service"]

[tool.ruff]
line-length = 119
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

# gtfs_rt_validator ships no py.typed marker, so mypy cannot see its inline
# annotations even though the source is fully typed. Every symbol imported from
# it would otherwise resolve to Any and strict mode would wave through a typo
# in a keyword argument. ignore_missing_imports (rather than turning strict off
# for this project) keeps everything ELSE in this tree checked.
[[tool.mypy.overrides]]
module = ["gtfs_rt_validator.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
