validator-test:
  stage: test
  interruptible: true
  image: ${IMAGE_PYTHON}
  services: []
  variables:
    IMAGE_PYTHON: "python:3.12"
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  before_script:
    - pip install --no-cache-dir uv
    - cd validator
    - uv sync --frozen
  cache:
    - key:
        prefix: uv-validator
        files:
          - validator/uv.lock
      paths:
        - .uv-cache/
  script:
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy validator_service
    - uv run pytest --junitxml=junit.xml
  after_script:
    - uv cache prune --ci || true
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: validator/junit.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &validator_test_paths
        - "validator/**/*"
        - "ci/validator-test.yaml"
        - ".gitlab-ci.yml"
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
      changes: *validator_test_paths
