# Monorepo-wide credential scan. Runs scripts/scan-secrets.py, which walks
# every git-tracked text file (app/, api/, docs/, helm/, node/, everything)
# looking for credential-shaped literals, and scripts/test_scan_secrets.py,
# the unit tests for scan-secrets.py's own sentinel and KNOWN_EXCEPTIONS
# guards. The most important of those, test_known_exception_paths_still_exist,
# exists to FAIL once a KNOWN_EXCEPTIONS path is moved or deleted (Phase 3),
# forcing the stale entry out rather than leaving it silently unenforced
# forever; that only works if this job actually runs it, which it did not
# before this job named it (it was a plain script no gate here invoked).
# scripts/test_scan_secrets.py is stdlib unittest, not pytest: it runs the
# same way scan-secrets.py itself does, with no extra dependency to install.
#
# Why this job exists and not just redash-test's own guard: node/tests
# has an AST check plus a repo-wide text scan
# (node/tests/query_runner/credential_scan.py), but that suite only ever
# runs against node/ in CI (ci/redash-test.yaml builds its image from
# node/ alone, with no .git reachable inside the container). A live vendor
# API key was found reproduced verbatim in a plan doc under
# docs/superpowers/plans/, a location that guard never sees in CI. This job
# is the monorepo-level backstop: it needs no docker build, no database, and
# no services, just a plain Python interpreter and the checked-out tree, so
# it stays cheap and runs on every pipeline rather than being gated on which
# paths changed. See scripts/scan-secrets.py for what it scans, what it
# excludes, and why.
scan-secrets:
  stage: test
  image: ${IMAGE_PYTHON}
  variables:
    # Public image, same situation as IMAGE_PYTHON in veodyn-api-test.yaml.
    # Point at Harbor if policy requires it.
    IMAGE_PYTHON: "python:3.11"
  # No services: the scan reads the working tree with the stdlib and `git
  # ls-files`, nothing else. Stated explicitly, and kept after .gitlab-ci.yml's
  # `default:` block was removed, so that reintroducing such a block cannot
  # quietly attach a container to a job that has no use for one. The two jobs
  # below say the same for the same reason.
  services: []
  before_script:
    # The scan's monorepo-wide coverage depends on `git ls-files` from a
    # reachable .git (see scripts/scan-secrets.py); without a git binary it
    # would silently fall back to scanning only node/, which the script
    # itself now refuses to do quietly (its per-prefix coverage sentinel,
    # scripts/scan_secrets_coverage.py, would fail the job with a clear
    # message instead). Install git up front so that never triggers: the
    # public python:3.11 image does not ship it.
    - apt-get update -qq && apt-get install -y --no-install-recommends git -qq > /dev/null
  script:
    - python3 scripts/scan-secrets.py
    # `python3 -m unittest discover`, not `pytest`: pytest is not installed
    # on this image or guaranteed anywhere scan-secrets.py itself runs (see
    # its own module docstring), and this is the safe, dependency-free form.
    # GitLab's shell executor fails the job on the first script line that
    # exits non-zero, so a failure in either this or the line above fails
    # the job the same way.
    - python3 -m unittest discover -s scripts -p "test_scan_secrets.py"
    # Third pattern, and it is not redundant: this file is named `*_test.py`,
    # not `test_*.py`, so the line above has never matched it. It holds both
    # expiry guards, the one that forces a stale KNOWN_EXCEPTIONS entry to be
    # deleted when its file leaves the tree, and the same for
    # EXTRA_ALLOWLISTED_LITERALS. Neither had ever run anywhere until this
    # line existed. Keep the name and this pattern in sync, or rename the
    # file to `test_*.py` and delete this line.
    - python3 -m unittest discover -s scripts -p "scan_secrets_known_exceptions_test.py"
    # compose/, not scripts/, and it belongs to this job rather than to one of
    # its own: compose/seed-redash.py is the script that MINTS this stack's two
    # API keys, so a guard on the decisions it makes about who holds them is
    # squarely this job's subject. It also needs exactly what this job already
    # has, a plain interpreter and the checkout, and no other job in the
    # pipeline offers that. compose/ has no CI job of its own; an unrun test
    # would have been the third instance of the failure this file's comments
    # already record twice.
    # `*_test.py`, not the one filename it used to name. compose/ now holds a
    # second one (seed_catalog_test.py) and naming each file here is the same
    # arrangement the comment above already regrets: a test that exists and runs
    # nowhere. Anything in compose/ ending `_test.py` runs from here.
    - python3 -m unittest discover -s compose -p "*_test.py"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    # A tag pipeline does not also match $CI_COMMIT_BRANCH, so without its own
    # rule the scan would never run on one. The release image builds that used
    # to make that urgent live on the private branch now, but the rule stays:
    # a tag is the moment a tree gets published somewhere, and that is the
    # last moment a credential scan is worth anything.
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /^features_.*$/'

# The other half of "must not be in the public tree": paths, not literals.
#
# The public/private split in this repository is a branch split. `main` keeps
# the deployment configuration (helm/envs/, helm/depends/, the deploy jobs)
# and the internal working documents; the `oss` branch had all of it deleted.
# Git enforces none of that. A `git merge main` into `oss` restores every one
# of those files in a single commit, with no conflict and no prompt, and
# several of them hold live deploy credentials. The failure is silent: the
# branch just stops being publishable and nothing says so. scan-secrets above
# does not catch it either, because those files' secrets are largely
# references to a Kubernetes secret rather than literals it would match.
#
# So: scripts/check-public-tree.py, against the manifest in
# scripts/public_tree_forbidden_paths.py. See both for what is listed and
# why, including the one path deliberately left off the list with an expiry.
check-public-tree:
  stage: test
  image: ${IMAGE_PYTHON}
  variables:
    IMAGE_PYTHON: "python:3.11"
  # Same as scan-secrets, and for the same reason. This one reads the tree
  # through `git ls-files` and never opens a matched file.
  services: []
  before_script:
    # The check is entirely `git ls-files`, so no git binary means no check at
    # all. The script exits 2 rather than passing in that case, but installing
    # git means that never has to be the outcome; the public python:3.11 image
    # does not ship it.
    - apt-get update -qq && apt-get install -y --no-install-recommends git -qq > /dev/null
  script:
    - python3 scripts/check-public-tree.py
    # Stdlib unittest, not pytest, for the same reason the job above uses it:
    # nothing is installed on this image. These tests plant a forbidden path
    # in a throwaway repository and assert the checker rejects it, so a green
    # run here is evidence the guard can still fail, not just that this tree
    # happens to be clean.
    - python3 -m unittest discover -s scripts -p "test_check_public_tree.py"
  rules:
    # Scoped to the public lineage, and it MUST stay that way: on `main` every
    # path in the manifest exists on purpose, so running this there would fail
    # every pipeline on the private branch and the only available fix would be
    # to weaken the manifest.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "oss"'
    - if: '$CI_COMMIT_BRANCH == "oss"'
    # The reorg branches that build `oss` up, so the guard has signal before
    # anything has merged. Remove this rule once the reorg is finished; the
    # two above are the permanent ones.
    - if: '$CI_COMMIT_BRANCH =~ /^feat\/public-reorg/'
    # No tag rule, deliberately, unlike scan-secrets above. Release tags are
    # cut from `main`, where these paths are supposed to exist, so a tag rule
    # would fail every release build.

# The third half of "must not be in the public tree", and the one the other
# two cannot see: identity. Not a credential, not a path, but the reference
# tenant staying identifiable from the tree. That is a vocabulary spread
# across comments, fixtures, example values and documentation, and it grows
# one harmless-looking line at a time in changes nobody would stop.
#
# scripts/check-clean-tree.py, against the declarations in
# scripts/clean_tree_identity_buckets.py, the scanning rules in
# scripts/clean_tree_identity_manifest.py and the ratchet in
# scripts/clean_tree_identity_baseline.py. Read the manifest first: it names
# no identity term itself (a gate that spelled the customer's name into its
# own manifest would have published it), so the terms are harvested at run
# time from the two guards in this tree that already carry them, and the
# output names a path, a line and a term index, never a value. Its log is as
# public as this file.
#
# A passing run still prints the open decisions and their counts. That is the
# point of it: the questions this phase could not answer, above all whether
# any of this ci/ directory belongs in a public tree at all, are stated on
# every run rather than buried in an exception list that reads as resolved.
check-clean-tree:
  stage: test
  image: ${IMAGE_PYTHON}
  variables:
    IMAGE_PYTHON: "python:3.11"
  # Same as the two jobs above, and for the same reason. Reads the tree with
  # the stdlib and `git ls-files`.
  services: []
  before_script:
    # Discovery is `git ls-files`, so no git binary means no check. The script
    # exits 2 rather than passing in that case; installing git means that
    # never has to be the outcome, and the public python:3.11 image does not
    # ship it.
    - apt-get update -qq && apt-get install -y --no-install-recommends git -qq > /dev/null
  script:
    - python3 scripts/check-clean-tree.py
    # Stdlib unittest, not pytest, for the same reason the jobs above use it.
    # These tests plant a real term (harvested at run time, never typed into
    # a test file) in a throwaway repository and assert the gate rejects it
    # and names the position, so a green run here is evidence the gate can
    # still fail rather than evidence this tree happens to be clean.
    #
    # The trailing `*` matters and is not decoration: the suite is four files,
    # test_check_clean_tree.py plus the _declarations, _patterns and _ratchet
    # siblings, split for file size and split again as the gate grew. An
    # exact-name pattern would collect the first and silently skip the other
    # three, which is the exact way a test file in this repository has already
    # gone unrun (see the third pattern in the job above). The count in this
    # comment is deliberately not load-bearing: the glob is what collects them.
    - python3 -m unittest discover -s scripts -p "test_check_clean_tree*.py"
  rules:
    # Same scoping as check-public-tree above, and it MUST stay that way. On
    # `main` the tenant's name is supposed to be everywhere: the deployment
    # configuration, the internal working documents and the pack references
    # all name it on purpose. Running this there would fail every pipeline on
    # the private branch and the only available fix would be to weaken the
    # declarations.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "oss"'
    - if: '$CI_COMMIT_BRANCH == "oss"'
    # The reorg branches that build `oss` up. Remove once the reorg is
    # finished, same as the sibling job's third rule.
    - if: '$CI_COMMIT_BRANCH =~ /^feat\/public-reorg/'
    # No tag rule, deliberately, for the same reason as check-public-tree:
    # release tags are cut from `main`.
