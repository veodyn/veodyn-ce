veodyn-api-test:
  stage: test
  image: ${IMAGE_PYTHON}
  variables:
    IMAGE_PYTHON: "python:3.11"
    POSTGRES_USER: veodyn
    POSTGRES_DB: veodyn_test
    POSTGRES_HOST_AUTH_METHOD: trust
    VEODYN_TEST_DATABASE_URL: "postgresql+psycopg://veodyn@postgres:5432/veodyn_test"
    VEODYN_TEST_REDIS_URL: "redis://redis:6379/15"
  services:
    - name: postgres:16
      alias: postgres
    - name: redis:7
      alias: redis
  before_script:
    - pip install --no-cache-dir uv
    - cd api
    - uv sync --frozen
  script:
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy veodyn_api
    - uv run pytest --junitxml=junit.xml --cov --cov-report=term --cov-report=xml:coverage.xml
    - uv run python -m veodyn_api.openapi > /tmp/openapi.json
    - diff -u openapi.json /tmp/openapi.json
    - uv run python -m veodyn_api.services.chat.help_index check ../docs/docs
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: api/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: api/coverage.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
